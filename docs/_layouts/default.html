<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4efe5">
  <title>{% if page.title %}{{ page.title }} · {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.summary | default: site.description | escape }}">
  <link rel="stylesheet" href="{{ '/assets/site.css' | relative_url }}">
</head>
<body>
  <header class="site-header">
    <div class="site-header__inner">
      <a class="site-brand" href="{{ '/' | relative_url }}">
        <span class="site-brand__seal">史</span>
        <span class="site-brand__text">
          <strong>{{ site.title }}</strong>
          <small>THE HISTORY HAPPENING NOW</small>
        </span>
      </a>
      <nav class="site-nav" aria-label="主导航">
        <a href="{{ '/' | relative_url }}">最新</a>
        <a href="{{ '/archive/' | relative_url }}">回目</a>
        <a href="{{ '/about/' | relative_url }}">缘起</a>
      </nav>
    </div>
  </header>

  <main>{{ content }}</main>

  <footer class="site-footer">
    <div class="site-footer__inner">
      <p>世界正在发生，书也就一直写下去。</p>
      <p class="site-footer__meta">《正在发生的世界史》 · GitHub Pages</p>
    </div>
  </footer>
</body>
</html>
