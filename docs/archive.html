---
layout: default
title: 回目总览
permalink: /archive/
---
<section class="page-shell archive-page">
  <header class="page-header">
    <div class="eyebrow">卷帙未完</div>
    <h1>回目总览</h1>
    <p>从最近的一回往前翻。每一天，都是后来历史里的一页。</p>
  </header>

  <ol class="archive-list">
    {% for post in site.posts %}
    <li>
      <a href="{{ post.url | relative_url }}">
        <span class="archive-list__episode">第 {{ post.episode }} 回</span>
        <strong>{{ post.title }}</strong>
        <span class="archive-list__summary">{{ post.summary }}</span>
        <time>{{ post.date | date: "%Y.%m.%d" }}</time>
      </a>
    </li>
    {% endfor %}
  </ol>
</section>
